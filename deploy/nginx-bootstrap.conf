## AIDM nginx bootstrap config — port 80 only.
##
## Used ONCE during initial deploy, before the Let's Encrypt cert exists.
## After `deploy/issue-cert.sh` succeeds, swap to `deploy/nginx.conf` and
## restart nginx. See deploy/README.md.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 200 "AIDM bootstrap — cert issuance in progress.\n";
            add_header Content-Type text/plain;
        }
    }
}
