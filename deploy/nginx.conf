## AIDM production nginx config.
##
## Serves the SvelteKit SPA from /srv/web, reverse-proxies /api/* to the
## orchestrator on 127.0.0.1:8000 (host networking — see docker-compose.prod.yml).
## TLS via Let's Encrypt; first cert issued by `deploy/issue-cert.sh`, certbot
## sidecar renews every 12h.
##
## Two server blocks:
##   80  → ACME HTTP-01 challenge + redirect everything else to 443
##   443 → TLS, SPA + /api proxy

user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Forwarded headers from Cloudflare. The slowapi rate limiter keys off
    # the remote address, so set_real_ip_from must list CF's IP ranges if
    # you want per-IP limiting to see the real client. For a closed beta
    # this is optional — start without it; revisit if you see abuse from
    # one address that shows up as a CF edge IP.
    # set_real_ip_from 203.0.113.0/24; ... (CF ranges)
    # real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/wasm;
    gzip_min_length 1024;

    log_format combined_with_ua '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" "$http_cf_connecting_ip"';
    access_log /var/log/nginx/access.log combined_with_ua;

    # ----- Port 80: ACME challenge + redirect -----
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----- Port 443: TLS, SPA + API -----
    #
    # Comment this entire block out for the FIRST boot, while the cert
    # does not yet exist. Once `deploy/issue-cert.sh` succeeds, uncomment
    # and `docker compose restart nginx`. (See deploy/README.md.)
    server {
        listen 443 ssl;
        http2 on;
        listen [::]:443 ssl;
        server_name aidm.example.com;

        ssl_certificate     /etc/letsencrypt/live/aidm.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aidm.example.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # Modest body cap — only SDP offers + small JSON go this way.
        client_max_body_size 1m;

        # ----- API: reverse proxy to orchestrator on loopback -----
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
            # WebSocket / SSE support (text mode SSE, future WS use).
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # SSE streams can sit idle between events for minutes.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /health {
            proxy_pass http://127.0.0.1:8000/health;
        }

        # ----- SPA: static SvelteKit build -----
        location / {
            root /srv/web;
            try_files $uri $uri/ /index.html;
            # SvelteKit hashed asset paths; cache aggressively.
            location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
                root /srv/web;
                expires 30d;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
