[project]
name = "aidm-orchestrator"
version = "0.1.0"
description = "AIDM voice loop: provider-based STT/LLM/TTS, mode=public|private"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
    # WebRTC pulls aiortc + opencv-python (Phase 6 browser transport).
    # opencv is large (~80MB wheel) but unavoidable — pipecat ties video and
    # audio aiortc usage to the same extra. We only use audio.
    # Pinned lower bound to 1.3 — Phase 6 onwards depends on the
    # SmallWebRTCTransport surface that landed in the 1.x line, and
    # the 0.0.x line is gone from PyPI's resolver as of mid-2026.
    "pipecat-ai[openai,groq,elevenlabs,silero,local,webrtc]>=1.3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    # Production deploy: per-IP rate limiting + Cloudflare Access JWT verify.
    # PyJWT[crypto] pulls cryptography for RS256.
    "slowapi>=0.1.9",
    "pyjwt[crypto]>=2.9",
]

[project.scripts]
aidm = "aidm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aidm"]
include = ["prompts/**"]
